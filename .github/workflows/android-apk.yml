name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Tipo de APK a generar
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Install required SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle project
        run: ./gradlew --no-daemon help --stacktrace

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Build release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: List APK outputs
        if: always()
        run: find app/build/outputs/apk -type f -name "*.apk" -print || true

      - name: Upload debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: vibing-sam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: vibing-sam-release-apk-unsigned-or-default
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
